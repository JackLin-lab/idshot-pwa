<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon-192.png">
<link rel="apple-touch-icon" href="app-icon-192.png">
<title>證件拍照助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>證件拍照助手</h1>
  <button id="btnInstall" class="ghost small" hidden>安裝</button>
</header>

<nav class="seg" id="seg">
  <button type="button" data-mode="id" class="on">身分證＋健保卡</button>
  <button type="button" data-mode="card">名片</button>
</nav>

<div id="banner" class="banner" hidden></div>
<div id="updBar" class="banner" hidden>已有新版本　<button type="button" id="btnReload" class="linkbtn">點此更新</button></div>

<main>
  <!-- 證件模式：三張照片進度 -->
  <section id="slotSec" hidden>
    <div class="slots" id="slots"></div>
  </section>

  <!-- 加註文字（證件用） -->
  <section id="stampSec" class="stampbox" hidden>
    <div class="stamphd">加註文字：深藍色楷書，印在三張證件照的空白處</div>
    <label><input type="checkbox" id="stA"> 僅供臺灣銀行</label>
    <label><input type="checkbox" id="stB"> 開戶</label>
    <label><input type="checkbox" id="stC"> 申辦貸款</label>
    <label><input type="checkbox" id="stD"> 申辦信用卡</label>
    <div class="stamppv" id="stampPv"></div>
    <button type="button" id="btnStampPv" class="mini">預覽加註效果</button>
    <div class="pvgrid" id="stampPvImgs"></div>
  </section>

  <!-- 拍後確認 -->
  <section id="reviewSec" class="panel" hidden>
    <p class="rvtip" id="rvTip"></p>
    <canvas id="rvCanvas"></canvas>
    <div class="row rvbtns">
      <button type="button" id="btnRotL" class="ghost">↺ 左轉 90°</button>
      <button type="button" id="btnRotR" class="ghost">↻ 右轉 90°</button>
    </div>
    <div class="row">
      <button type="button" id="btnRetake" class="ghost">重拍</button>
      <button type="button" id="btnRvOk" class="primary">確定，開始辨識</button>
    </div>
  </section>

  <!-- 相機 -->
  <section id="camSec">
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <div id="guide"></div>
      <div id="hint"></div>
    </div>
    <p id="camErr" class="err" hidden></p>
    <div class="orient" id="orient">
      <button type="button" id="btnOrient"></button>
    </div>
    <div class="camctl">
      <button type="button" id="btnShot" class="shot" aria-label="拍照"></button>
    </div>
    <div class="row3">
      <button type="button" id="btnSys" class="ghost small">系統相機</button>
      <button type="button" id="btnGallery" class="ghost small">相簿</button>
      <button type="button" id="btnSwitch" class="ghost small">換鏡頭</button>
    </div>
    <label class="opt" id="optCrop"><input type="checkbox" id="chkCrop" checked> 名片依取景框裁切（取消則存整個畫面）</label>
    <label class="opt"><input type="checkbox" id="chkConfirm" checked> 拍完先確認方向（可旋轉）再辨識</label>
    <input type="file" id="fileSys" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileGallery" accept="image/*" hidden>
  </section>

  <!-- 名片結果 -->
  <section id="cardPanel" class="panel" hidden>
    <img id="cardImg" alt="名片預覽">
    <div class="ocrstat" id="cardStat"></div>
    <label>姓名<input id="cardName" autocomplete="off" placeholder="辨識後可修改"></label>
    <div class="chips" id="cardChips"></div>
    <label>公司名稱<input id="cardCompany" autocomplete="off" placeholder="辨識後可修改"></label>
    <div class="chips" id="cardCoChips"></div>
    <div class="poolbox" id="cardPoolBox" hidden>
      <div class="pooltop">
        <span>OCR 文字，點選加入：</span>
        <div class="orient small" id="cardTarget">
          <button type="button" data-t="name" class="on">→ 姓名</button>
          <button type="button" data-t="company">→ 公司</button>
        </div>
        <button type="button" id="btnPoolClear" class="mini">清空此欄</button>
      </div>
      <div class="chips" id="cardPool"></div>
      <p class="hintsm">可連續點選多個，依順序接在一起；再點一次取消。第一次點選會取代欄位原本的內容。</p>
    </div>
    <label>檔名（預設：姓名_公司名稱）
      <div class="fnrow"><input id="cardFile" autocomplete="off"><span>.jpg</span></div>
    </label>
    <div class="row">
      <button type="button" id="btnCardSave" class="primary">儲存照片</button>
      <button type="button" id="btnCardShare" class="ghost" hidden>分享</button>
    </div>
    <button type="button" id="btnCardNext" class="ghost wide">拍下一張名片</button>
  </section>

  <!-- 證件結果 -->
  <section id="idPanel" class="panel" hidden>
    <div class="ocrstat" id="idStat"></div>
    <label>姓名（Word 檔名）<input id="idName" autocomplete="off" placeholder="辨識後可修改"></label>
    <div class="chips" id="idChips"></div>
    <div class="poolbox" id="idPoolBox" hidden>
      <div class="pooltop"><span>OCR 文字，點選加入姓名：</span><button type="button" id="btnIdPoolClear" class="mini">清空姓名</button></div>
      <div class="chips" id="idPool"></div>
    </div>
    <p class="fn" id="idFn"></p>
    <div class="row">
      <button type="button" id="btnDocx" class="primary" disabled>產生 Word 檔</button>
      <button type="button" id="btnIdShare" class="ghost" disabled hidden>分享</button>
    </div>
    <button type="button" id="btnIdReset" class="ghost wide">新的一位（清除全部）</button>
  </section>

  <p class="note"><span id="fixCount"></span> <button type="button" id="btnFixClear" class="linkbtn" hidden>清除</button></p>
  <p class="note" id="ver"></p>
  <p class="note">影像與姓名辨識都在手機本機處理，不會上傳。首次使用 OCR 需連網下載辨識引擎與中文語言包（數十 MB），之後會快取。</p>
</main>

<script src="parse.js"></script>
<script src="docx-lite.js"></script>
<script src="app.js"></script>
</body>
</html>
